<title>Look Match Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: a photo studio bench. Top bar switches Library / Develop / Export; left = folders or looks, centre = photos, right = info or sliders.
   Deliberately single-theme: a neutral gray surround is the right ground for judging colour. */
:root {
  color-scheme: dark;
  --bg: #141414; --rail: #1b1b1b; --panel: #222222; --panel-2: #282828; --line: #303030; --line-2: #404040;
  --fg: #ebebeb; --muted: #9b9b9b; --faint: #6c6c6c;
  --accent: #f0a63a; --accent-ink: #1a1206; --accent-soft: rgba(240,166,58,.15);
  --pick: #f3f3f3; --reject: #e46a5a; --star: #f0c24a; --ok: #84c27f; --warn: #e7b25a; --info: #7fa7d8;
  --stage: #101010;
  --font-ui: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; line-height: 1.4; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
select { background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 6px; }
select option { background: #1c1c1c; color: #eee; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
.top { display: flex; align-items: center; gap: 18px; padding-block: 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--rail); }
.brand { font-weight: 800; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.mods { display: flex; gap: 2px; background: #111; padding: 3px; border-radius: 8px; }
.mods button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; font-weight: 700; color: var(--muted); }
.mods button[aria-current=true] { background: #2e2e2e; color: var(--fg); }
.mods button kbd { font-family: var(--font-mono); font-size: 10px; color: var(--faint); margin-left: 6px; }
.top .grow { flex: 1; }
.prog { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; min-width: 0; }
.prog .bar { width: 160px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

.btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 6px; padding: 6px 11px; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; position: relative; }
.btn:hover { border-color: #5c5c5c; background: #303030; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #f5b453; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: #2a2a2a; }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn.danger { color: var(--reject); }
.btn input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.work { display: grid; grid-template-columns: 270px minmax(0,1fr) 300px; min-height: 0; }
.left, .right { background: var(--rail); overflow-y: auto; min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
.left { border-right: 1px solid var(--line); padding-left: max(12px, env(safe-area-inset-left, 0px)); }
.right { border-left: 1px solid var(--line); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.center { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }

.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-h h2 { margin: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 4px 0; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "▸"; font-size: 10px; }
details.sec[open] > summary::after { content: "▾"; }
details.sec { border-top: 1px solid var(--line); padding-top: 8px; }
.note { color: var(--faint); font-size: 11.5px; margin: 0; }
.msg { font-size: 12px; padding: 7px 9px; border-radius: 6px; }
.msg.err { background: rgba(228,106,90,.13); color: #f2a79c; }
.msg.warn { background: var(--accent-soft); color: #f3c98a; }
.msg.ok { background: rgba(132,194,127,.13); color: #b9dcb6; }

/* folders */
.folders { display: flex; flex-direction: column; gap: 1px; }
.folder { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 0; background: transparent; text-align: left; width: 100%; }
.folder:hover { background: #262626; }
.folder[aria-current=true] { background: #2f2f2f; }
.folder .ic { width: 16px; text-align: center; color: var(--muted); font-size: 12px; }
.folder .nm { flex: 1; min-width: 0; }
.folder .ct { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.folder .why { display: block; font-size: 11px; color: var(--faint); }

/* grid */
.gridbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.gridbar .title { font-weight: 700; }
.gridbar .count { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.gridbar .grow { flex: 1; }
.gridscroll { flex: 1; min-height: 0; overflow-y: auto; }
.grid { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 170px), 1fr)); gap: 10px; align-content: start; }
.cell { position: relative; background: #1c1c1c; border-radius: 6px; border: 2px solid transparent; aspect-ratio: 3 / 2; overflow: hidden; cursor: pointer; padding: 0; }
.cell img { width: 100%; height: 100%; object-fit: contain; display: block; background: #181818; }
.cell.sel { border-color: #6a6a6a; }
.cell.active { border-color: var(--accent); }
.cell.rejected img { opacity: .32; }
.cell .badges { position: absolute; left: 4px; top: 4px; display: flex; gap: 3px; flex-wrap: wrap; }
.badge { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; background: rgba(0,0,0,.72); color: #fff; }
.badge.best { background: var(--ok); color: #0f1f0d; }
.badge.dup { color: #cfcfcf; }
.badge.soft { color: var(--warn); }
.badge.eyes { color: #ffb4a8; }
.badge.expo { color: var(--info); }
.cell .flag { position: absolute; right: 5px; top: 4px; font-size: 13px; text-shadow: 0 1px 2px #000; }
.cell .stars { position: absolute; left: 6px; bottom: 4px; color: var(--star); font-size: 11px; letter-spacing: 1px; text-shadow: 0 1px 2px #000; }
.cell .edited { position: absolute; right: 6px; bottom: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.cell .pending { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 11px; }

.empty { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 36px 28px; max-width: 620px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; background: #171717; }
.drop.drag { border-color: var(--accent); background: #1d1a14; }
.drop h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.drop p { margin: 0; color: var(--muted); max-width: 52ch; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; width: 100%; margin-top: 6px; text-align: left; }
.steps div { background: #1f1f1f; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.steps b { display: block; font-size: 12.5px; }
.steps span { color: var(--muted); font-size: 11.5px; }

/* stage */
.stagebar { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.stagebar .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed=true] { background: #353535; color: var(--fg); }
.stage { flex: 1; min-height: 0; position: relative; background: var(--stage); display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
.frame { position: relative; line-height: 0; }
.frame canvas { display: block; width: 100%; height: 100%; }
.frame canvas.cmp, .frame canvas.ov { position: absolute; inset: 0; }
.frame canvas.ov { pointer-events: none; }
.handle { position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px; cursor: ew-resize; display: flex; justify-content: center; touch-action: none; z-index: 2; }
.handle::before { content: ""; width: 2px; height: 100%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.handle::after { content: "\2039\00a0\00a0\203A"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #111; font: 700 20px/38px var(--font-sans, system-ui); text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.25); }
.handle:hover::after, .handle:focus-visible::after { background: var(--accent); }
.frame.slide { cursor: ew-resize; }
.corner { position: absolute; top: 8px; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: rgba(0,0,0,.6); color: #fff; padding: 3px 7px; border-radius: 4px; line-height: 1.2; pointer-events: none; z-index: 2; }
.corner.l { left: 8px; } .corner.r { right: 8px; }
.cursor { position: absolute; border: 1.5px solid rgba(255,255,255,.9); border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.5); transform: translate(-50%,-50%); z-index: 3; }
.loading { position: absolute; right: 10px; bottom: 10px; font-size: 11px; color: #ccc; background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 4px; line-height: 1.3; z-index: 3; }
.stage-msg { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 4; }

/* filmstrip */
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--rail); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.strip .cell { flex: 0 0 auto; width: 96px; aspect-ratio: 3 / 2; }

/* panels */
.sl { display: grid; grid-template-columns: 82px minmax(0,1fr) 40px; gap: 8px; align-items: center; }
.sl label { font-size: 12px; color: #d6d6d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl output { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 18px; }
.sl.temp input { accent-color: #8fb0d8; }
.sl.mod output { color: var(--accent); }
.tabs { display: flex; gap: 2px; background: #151515; padding: 2px; border-radius: 6px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 4px 6px; border-radius: 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tabs button[aria-pressed=true] { background: #333; color: var(--fg); }
.swatch-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 0; }
select.text, input.text { background: #191919; border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 8px; width: 100%; min-width: 0; }
.kv { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 4px 10px; font-size: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere; }
.meter { height: 5px; background: #333; border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.callout { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.callout b { font-weight: 700; }
.mini-thumbs { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px; }
.mini-thumbs button { padding: 0; border: 2px solid transparent; border-radius: 4px; overflow: hidden; background: #1a1a1a; aspect-ratio: 3/2; position: relative; }
.mini-thumbs button.cur { border-color: var(--accent); }
.mini-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-thumbs .b { position: absolute; left: 2px; top: 2px; font-size: 8px; background: var(--ok); color: #0f1f0d; padding: 0 3px; border-radius: 2px; font-weight: 800; }

/* looks */
.looks { display: flex; flex-direction: column; gap: 6px; }
.look { display: grid; grid-template-columns: 58px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); text-align: left; width: 100%; }
.look:hover { border-color: var(--line-2); }
.look.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
label.row { flex-wrap: nowrap; align-items: flex-start; }
label.row input[type=checkbox] { flex: none; margin-top: 2px; }
.agent textarea { width: 100%; resize: vertical; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 8px; font-size: 12px; line-height: 1.4; color: inherit; font-family: var(--font-ui); }
.agrefs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.agref { position: relative; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden; background: var(--panel); }
.agref img { width: 100%; height: 100%; object-fit: cover; display: block; }
.agref button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; cursor: pointer; }
.agent .dropzone { padding: 10px; }
.agent { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.dd { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 2px 4px 2px 0; cursor: pointer; color: inherit; border-radius: 5px; }
.dd:hover { color: var(--accent); } .dd:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dd-c { font-size: 11px; width: 10px; }
.dd h2 { white-space: nowrap; margin: 0; }
.sec-h .row { flex-wrap: nowrap; gap: 2px; }
.sec-h .row .btn { white-space: nowrap; padding-inline: 6px; }
.sw { position: relative; display: inline-flex; width: 34px; height: 20px; flex: none; cursor: pointer; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sw-t { width: 34px; height: 20px; border-radius: 10px; background: var(--line-2); transition: background .15s; position: relative; }
.sw-t::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw input:checked + .sw-t { background: var(--accent); }
.sw input:checked + .sw-t::after { transform: translateX(14px); }
.sw input:focus-visible + .sw-t { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw input:disabled + .sw-t { opacity: .4; }
.look canvas { width: 58px; height: 34px; border-radius: 4px; display: block; }
.look .nm { font-weight: 700; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.look .mt { color: var(--muted); font-size: 11px; font-family: var(--font-mono); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 14px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
.chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.dialog { background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; width: min(620px, 100%); max-height: calc(100% - 40px); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.dialog h3 { margin: 0; font-size: 16px; font-weight: 800; }
.dialog p { margin: 0; color: var(--muted); }
.dropzone { position: relative; border: 1.5px dashed var(--line-2); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); background: #1c1c1c; }
.dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--fg); }
.dropzone b { color: var(--fg); display: block; }
.dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.refs { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; }
.refs .rt { position: relative; aspect-ratio: 3 / 2; border-radius: 5px; overflow: hidden; background: #1a1a1a; }
.refs .rt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.refs .rt span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
.refs .rt button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: rgba(0,0,0,.75); color: #fff; font-size: 10px; line-height: 18px; padding: 0; }
.pairrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.pairrow .dropzone { padding: 10px; min-height: 64px; overflow: hidden; }
.pairrow .dropzone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.radio { display: flex; flex-direction: column; gap: 6px; }
.radio label { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.radio label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio small { display: block; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #2b2b2b; border: 1px solid var(--line-2); padding: 8px 14px; border-radius: 8px; z-index: 60; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,.4); max-width: calc(100% - 32px); }
.kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11.5px; color: var(--muted); }


/* ============ Skin: "lens coating" ============
   Graphite bench so colour can be judged honestly; the one loud thing is the dichroic sheen of a coated lens
   (amber, magenta, violet, teal) that marks what the AI is touching and moves only while it works. */
:root {
  --bg: #1b1c1f; --rail: #212226; --panel: #2a2b30; --panel-2: #303137; --line: #34363c; --line-2: #45474e;
  --fg: #eceef1; --muted: #a1a4ab; --faint: #73767e; --stage: #161618;
  --coat: linear-gradient(115deg, #ffb45c 0%, #f06bd8 34%, #8f7cff 66%, #3fe0c5 100%);
  --coat-c: conic-gradient(from 210deg, #ffb45c, #f06bd8, #8f7cff, #3fe0c5, #ffb45c);
  --accent: #b6a6ff; --accent-ink: #15131f; --accent-soft: rgba(182,166,255,.14);
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-wide: "Unbounded", "Geist", ui-sans-serif, sans-serif;
}
body { font-size: 13px; letter-spacing: .005em; }
:focus-visible { outline-color: #c9bcff; }

/* top bar: wordmark with a coated lens ring */
.top { background: #1e1f23; border-bottom-color: #2c2e33; padding-block: 10px; }
.brand { font-family: var(--font-wide); font-weight: 700; font-size: 15px; letter-spacing: -.02em; display: inline-flex; align-items: center; gap: 0; white-space: pre; }
.brand::before { content: ""; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #1e1f23 0 40%, transparent 41%), var(--coat-c); box-shadow: 0 0 18px rgba(143,124,255,.35); flex: none; margin-right: 10px; }
.brand span { color: inherit; }
.mods { background: #17181b; border: 1px solid #2c2e33; border-radius: 999px; padding: 3px; }
.mods button { border-radius: 999px; padding: 6px 16px; font-weight: 600; }
.mods button[aria-current=true] { background: #2f3036; color: #fff; box-shadow: inset 0 -2px 0 0 transparent; position: relative; }

@media (prefers-reduced-motion: reduce) { body.ai-busy .agent::before, body.ai-busy .frame::after-disabled { animation: none; } body.ai-busy .frame::after-disabled { display: none; } }

@keyframes holo-float { 50% { transform: translateY(-2.5px); } }
@keyframes holo-turn { 0% { transform: scaleX(1); } 50% { transform: scaleX(.35); } 100% { transform: scaleX(1); } }

/* AI core: rings turn slowly at rest, faster while working; the focus point follows the hand; the voice line moves while it talks */

.core .core-outer { animation: core-spin 38s linear infinite; }

.core .core-inner { animation: core-spin 9s linear infinite; }

.holo[data-state=idle] .core { opacity: .8; }
/* status colours: amber = photos coming in, red = editing, green = ready / done */
.holo { --c1: #8f7cff; --c2: #ffb45c; --c3: #3fe0c5; }

.core .core-mid circle { stroke: var(--c1); transition: stroke .6s; }

/* live status bar while the AI edits */
